name: Spiel-ZIPs erstellen

on:
  push:
    branches: ['codex/downloads-dd6fef5']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Mac mit Apple-Chip
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Build-Pakete installieren
        run: python -m pip install -r requirements-build.txt
      - name: Mac-App erstellen und ZIP prüfen
        run: python build_macos.py --expected-arch arm64 --source-commit dd6fef51d4e32e283f7cd3f743a4bfb86507d70b
      - name: Mac-Download speichern
        uses: actions/upload-artifact@v7
        with:
          path: dist/macos/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
